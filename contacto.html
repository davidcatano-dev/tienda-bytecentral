<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · ByteCentral</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="container py-3">
    <header class="encabezado">
        <h1>Contacto</h1>
        <p>¿Tienes dudas sobre qué equipo elegir? Escríbenos y te asesoramos sin costo.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="formulario-seccion">
            <h2>Formulario de Asesoría Energética</h2>
            <form action="#" method="post" class="form-contacto">
                <div class="campo-grupo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="María Pérez" required>
                </div>

                <div class="campo-grupo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="campo-grupo">
                    <label for="telefono">Teléfono de contacto:</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="300 123 4567" required>
                </div>

                <div class="campo-grupo">
                    <label for="tipo-vivienda">Tipo de instalación / vivienda:</label>
                    <select id="tipo-vivienda" name="tipo-vivienda" class="form-select" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="apartamento">Apartamento</option>
                        <option value="casa">Casa independiente</option>
                        <option value="comercial">Local / Negocio</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="mensaje">Mensaje o inquietud:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" class="form-control" maxlength="200" placeholder="Describe los equipos que deseas reemplazar o tu consumo actual en kWh..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary mt-3 w-100">Enviar Consulta</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <p>Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
